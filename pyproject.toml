[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redscrape"
version = "0.1.0"
description = "Fast, parallel Reddit scraper — multi-subreddit posts + full comment trees, archive/monitor/search."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.scripts]
redscrape = "redscrape.cli:main"

[tool.setuptools]
packages = ["redscrape"]
